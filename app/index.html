<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>識字練習 — Character Recognition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: oklch(0.94 0.012 80);
      --card-bg: oklch(0.985 0.006 80);
      --card-bg-hover: oklch(0.995 0.004 80);
      --card-border: oklch(0 0 0 / 0.06);
      --card-border-hover: oklch(0 0 0 / 0.09);
      --text: oklch(0.22 0.02 50);
      --text-secondary: oklch(0.52 0.015 60);
      --accent: oklch(0.70 0.16 50);
      --accent-hover: oklch(0.65 0.17 50);
      --accent-soft: oklch(0.70 0.16 50 / 0.12);
      --toolbar-bg: oklch(0.985 0.006 80 / 0.72);
      --toolbar-border: oklch(0 0 0 / 0.06);
      --shadow-card: 0 1px 2px oklch(0 0 0 / 0.05);
      --shadow-toolbar: 0 1px 2px oklch(0 0 0 / 0.04), 0 4px 16px oklch(0 0 0 / 0.03);
      --shadow-image: 0 8px 32px oklch(0 0 0 / 0.12), 0 2px 8px oklch(0 0 0 / 0.08);
      --shadow-modal: 0 20px 60px oklch(0 0 0 / 0.2);
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --toolbar-h: 56px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-synthesis: none;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
    }

    ::selection {
      background: var(--accent-soft);
    }

    /* ---- Toolbar ---- */
    .toolbar {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.75rem 1.25rem;
      min-height: var(--toolbar-h);
      background: var(--toolbar-bg);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      box-shadow: var(--shadow-toolbar);
    }

    .toolbar-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .toolbar-progress {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.625rem;
      min-width: 0;
    }

    .progress-text {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .toolbar-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.875rem;
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      color: var(--text);
      background: transparent;
      box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1);
      border: none;
      border-radius: 0.625rem;
      cursor: pointer;
      transition-property: scale, background, box-shadow;
      transition-duration: 0.15s;
      transition-timing-function: ease-out;
    }

    .btn:hover {
      background: oklch(0 0 0 / 0.04);
    }

    .btn:active {
      scale: 0.96;
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.1), 0 0 0 3px var(--accent-soft);
    }

    .btn-primary {
      background: var(--accent);
      color: oklch(0.98 0.01 80);
      box-shadow: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-primary:focus-visible {
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* ---- Page area ---- */
    .page-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
    }

    .page-wrapper {
      position: relative;
      max-height: 100%;
      max-width: 100%;
    }

    .book-page {
      display: block;
      max-width: 100%;
      max-height: calc(100dvh - var(--toolbar-h) - 2rem);
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 0.5rem;
      outline: 1px solid oklch(0 0 0 / 0.1);
      box-shadow: var(--shadow-image);
    }

    .cards-overlay {
      position: absolute;
      inset: 0;
      border-radius: 0.5rem;
      overflow: hidden;
    }

    /* ---- Card ---- */
    .card-wrapper {
      position: absolute;
      container-type: size;
      cursor: pointer;
    }

    .card-face {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background: var(--card-bg);
      box-shadow:
        inset 0 0 0 1px var(--card-border),
        var(--shadow-card);
      font-family: "Noto Serif TC", "PingFang TC", "Microsoft YaHei", serif;
      font-weight: 700;
      font-size: 58cqh;
      color: var(--text);
      line-height: 1;
      opacity: 1;
      transition-property: background, box-shadow, opacity;
      transition-duration: 0.4s;
      transition-timing-function: var(--ease);
    }

    .card-wrapper.revealed .card-face {
      background: transparent;
      box-shadow: none;
    }

    .card-wrapper.faded .card-face {
      opacity: 0;
    }

    .card-wrapper:not(.revealed):hover .card-face {
      background: var(--card-bg-hover);
      box-shadow:
        inset 0 0 0 1px var(--card-border-hover),
        0 2px 8px oklch(0 0 0 / 0.08);
    }

    .card-wrapper:not(.revealed):active .card-face {
      scale: 0.96;
      transition-property: scale;
      transition-duration: 0.1s;
      transition-timing-function: ease-out;
    }

    /* Entrance animation */
    @keyframes cardEnter {
      from {
        opacity: 0;
        scale: 0.85;
      }
      to {
        opacity: 1;
        scale: 1;
      }
    }

    .card-wrapper {
      animation: cardEnter 0.35s var(--ease) backwards;
    }

    /* ---- Edit modal ---- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: oklch(0 0 0 / 0.3);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition-property: opacity;
      transition-duration: 0.25s;
      transition-timing-function: ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: oklch(0.99 0.004 80);
      border-radius: 1rem;
      padding: 1.5rem;
      max-width: 460px;
      width: calc(100% - 2rem);
      box-shadow: var(--shadow-modal);
      scale: 0.95;
      transition-property: scale;
      transition-duration: 0.25s;
      transition-timing-function: var(--ease);
    }

    .modal-overlay.active .modal {
      scale: 1;
    }

    .modal h2 {
      font-size: 1.125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 1rem;
    }

    .modal-field {
      margin-bottom: 0.875rem;
    }

    .modal-field label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.375rem;
    }

    .modal-input {
      width: 100%;
      font-family: "Noto Serif TC", "PingFang TC", serif;
      font-size: 1.125rem;
      line-height: 1.8;
      padding: 0.625rem 0.75rem;
      border: none;
      box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.15);
      border-radius: 0.5rem;
      resize: vertical;
      letter-spacing: 0.05em;
      color: var(--text);
      background: oklch(0.97 0.006 80);
      transition-property: box-shadow, background;
      transition-duration: 0.15s;
      transition-timing-function: ease-out;
    }

    .modal-input:focus {
      outline: none;
      box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 3px var(--accent-soft);
      background: oklch(0.99 0.004 80);
    }

    .modal-input[type="number"] {
      width: 80px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
      letter-spacing: 0;
      resize: none;
    }

    .modal-input[type="text"] {
      font-size: 1.125rem;
      line-height: 1.5;
      resize: none;
    }

    .modal-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 1.25rem;
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .card-face {
        transition-property: opacity;
        transition-duration: 0.2s;
      }
      .card-wrapper {
        animation: none;
      }
      .modal {
        transition: opacity 0.2s ease;
        scale: 1;
      }
      .modal-overlay {
        transition: opacity 0.2s ease;
      }
    }

    /* ---- Responsive ---- */
    @media (max-width: 640px) {
      .toolbar {
        padding: 0.625rem 0.75rem;
        gap: 0.5rem;
      }
      .toolbar-title {
        display: none;
      }
      .btn {
        padding: 0.4rem 0.625rem;
        font-size: 0.75rem;
      }
      .progress-text {
        font-size: 0.8125rem;
      }
      .page-container {
        padding: 0.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar">
      <span class="toolbar-title">識字練習</span>
      <div class="toolbar-progress">
        <span class="progress-text" id="priorityText">0 / 0</span>
      </div>
      <div class="toolbar-actions">
        <button class="btn" id="editBtn">Edit</button>
        <button class="btn" id="resetBtn">Reset</button>
        <button class="btn btn-primary" id="revealBtn">Reveal All</button>
      </div>
    </header>
    <main class="page-container">
      <div class="page-wrapper" id="pageWrapper">
        <img src="assets/page1.jpg" alt="Book page" class="book-page" id="bookPage">
        <div class="cards-overlay" id="cardsOverlay"></div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>Edit Characters</h2>
      <div class="modal-field">
        <label for="editText">Characters (reading order: right-to-left, top-to-bottom)</label>
        <textarea id="editText" class="modal-input" spellcheck="false" lang="zh-TW"></textarea>
      </div>
      <div class="modal-field">
        <label for="editCols">Number of columns</label>
        <input type="number" id="editCols" class="modal-input" min="1" max="8" value="3">
      </div>
      <div class="modal-field">
        <label for="editPriority">High priority characters (reveal all when these are found)</label>
        <input type="text" id="editPriority" class="modal-input" spellcheck="false" lang="zh-TW" placeholder="e.g. 小女天">
      </div>
      <div class="modal-actions">
        <button class="btn" id="editCancel">Cancel</button>
        <button class="btn btn-primary" id="editSave">Save</button>
      </div>
    </div>
  </div>

  <script>
    const INITIAL_CHARS = "小女孩很喜歡小天總是給她換各種漂亮的衣服和飾品";
    const INITIAL_COLS = 3;
    const INITIAL_PRIORITY = "小女天衣";

    let state = {
      chars: INITIAL_CHARS,
      numCols: INITIAL_COLS,
      priority: INITIAL_PRIORITY,
    };

    let cards = [];
    let cardData = [];
    let revealedCount = 0;
    let priorityRevealed = 0;
    let priorityTotal = 0;
    let autoRevealing = false;

    function distributeChars(chars, numCols) {
      const total = chars.length;
      const baseCount = Math.floor(total / numCols);
      const extra = total % numCols;
      const columns = [];
      let idx = 0;
      for (let col = 0; col < numCols; col++) {
        const count = baseCount + (col < extra ? 1 : 0);
        columns.push(chars.slice(idx, idx + count).split(''));
        idx += count;
      }
      return columns;
    }

    function computePositions(columns) {
      const numCols = columns.length;
      const maxRows = Math.max(...columns.map(c => c.length));
      const colWidth = 1 / numCols;
      const rowHeight = 1 / maxRows;
      const positions = [];
      for (let col = 0; col < numCols; col++) {
        const x = (numCols - 1 - col) * colWidth;
        for (let row = 0; row < columns[col].length; row++) {
          const y = row * rowHeight;
          positions.push({
            char: columns[col][row],
            x, y, w: colWidth, h: rowHeight,
          });
        }
      }
      return positions;
    }

    function renderCards() {
      const overlay = document.getElementById('cardsOverlay');
      overlay.innerHTML = '';
      cards = [];
      cardData = [];
      revealedCount = 0;
      priorityRevealed = 0;

      const prioritySet = new Set(state.priority.split('').filter(c => state.chars.includes(c)));
      priorityTotal = [...prioritySet].reduce((acc, c) => acc + state.chars.split('').filter(ch => ch === c).length, 0);

      const columns = distributeChars(state.chars, state.numCols);
      const positions = computePositions(columns);

      positions.forEach((p, i) => {
        const isPriority = prioritySet.has(p.char);
        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.left = (p.x * 100) + '%';
        wrapper.style.top = (p.y * 100) + '%';
        wrapper.style.width = (p.w * 100) + '%';
        wrapper.style.height = (p.h * 100) + '%';
        wrapper.style.animationDelay = (i * 30) + 'ms';

        const face = document.createElement('div');
        face.className = 'card-face';
        face.textContent = p.char;
        wrapper.appendChild(face);

        const data = { wrapper, char: p.char, isPriority, index: i };
        cardData.push(data);

        wrapper.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          if (autoRevealing) return;
          toggleCard(data);
        });

        overlay.appendChild(wrapper);
        cards.push(wrapper);
      });

      updateProgress();
    }

    function toggleCard(data) {
      const isRevealed = data.wrapper.classList.toggle('revealed');
      if (isRevealed) {
        revealedCount++;
        if (data.isPriority) priorityRevealed++;
        if (navigator.vibrate) navigator.vibrate(10);
      } else {
        revealedCount = Math.max(0, revealedCount - 1);
        if (data.isPriority) priorityRevealed = Math.max(0, priorityRevealed - 1);
      }
      updateProgress();
      checkPriorityComplete();
    }

    function updateProgress() {
      document.getElementById('priorityText').textContent = `${priorityRevealed} / ${priorityTotal}`;
    }

    function checkPriorityComplete() {
      if (priorityTotal > 0 && priorityRevealed === priorityTotal && revealedCount < cards.length && !autoRevealing) {
        autoRevealAll();
      }
    }

    function autoRevealAll() {
      autoRevealing = true;
      const unrevealed = cardData.filter(d => !d.wrapper.classList.contains('revealed'));
      const totalSteps = unrevealed.length;
      unrevealed.forEach((d, i) => {
        setTimeout(() => {
          d.wrapper.classList.add('revealed');
          revealedCount++;
          if (navigator.vibrate && i % 3 === 0) navigator.vibrate(8);
          updateProgress();
          if (i === totalSteps - 1) {
            autoRevealing = false;
            fadeAllCards();
          }
        }, i * 60);
      });
    }

    function fadeAllCards() {
      cardData.forEach((d, i) => {
        setTimeout(() => {
          d.wrapper.classList.add('faded');
        }, i * 40);
      });
    }

    function resetAll() {
      autoRevealing = false;
      cards.forEach(c => {
        c.classList.remove('revealed');
        c.classList.remove('faded');
      });
      revealedCount = 0;
      priorityRevealed = 0;
      updateProgress();
    }

    function revealAll() {
      const unrevealed = cardData.filter(d => !d.wrapper.classList.contains('revealed'));
      unrevealed.forEach((d, i) => {
        setTimeout(() => {
          d.wrapper.classList.add('revealed');
          revealedCount++;
          if (d.isPriority) priorityRevealed++;
          if (navigator.vibrate && i % 3 === 0) navigator.vibrate(8);
          updateProgress();
        }, i * 35);
      });
    }

    function openEdit() {
      document.getElementById('editText').value = state.chars;
      document.getElementById('editCols').value = state.numCols;
      document.getElementById('editPriority').value = state.priority;
      document.getElementById('editModal').classList.add('active');
      setTimeout(() => document.getElementById('editText').focus(), 250);
    }

    function closeEdit() {
      document.getElementById('editModal').classList.remove('active');
    }

    function saveEdit() {
      const text = document.getElementById('editText').value.replace(/\s/g, '');
      const cols = parseInt(document.getElementById('editCols').value) || 3;
      const priority = document.getElementById('editPriority').value.replace(/\s/g, '');
      if (!text) return;
      state.chars = text;
      state.numCols = Math.max(1, Math.min(8, cols));
      state.priority = priority;
      closeEdit();
      renderCards();
    }

    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('revealBtn').addEventListener('click', revealAll);
    document.getElementById('editBtn').addEventListener('click', openEdit);
    document.getElementById('editCancel').addEventListener('click', closeEdit);
    document.getElementById('editSave').addEventListener('click', saveEdit);
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeEdit();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeEdit();
    });

    renderCards();
  </script>
</body>
</html>
